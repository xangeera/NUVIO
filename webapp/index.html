<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--hue:200;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#14181c);--hint:var(--tg-theme-hint-color,#6b7580);--panel:var(--tg-theme-secondary-bg-color,#f1f3f5);--accent:hsl(var(--hue) 70% 45%);--tint:hsl(var(--hue) 80% 50%/.14)}
*{box-sizing:border-box;margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
input,button{font:inherit;color:var(--text)}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:var(--panel)}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--panel);cursor:pointer}
button.p{background:var(--accent);color:#fff;font-weight:700}button.danger{color:#d33;background:none;margin-top:18px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;background:none;font-weight:600;color:var(--hint)}.tabs .on{background:var(--bg);color:var(--text)}
.tabs #lang{flex:none;width:46px;padding:0;display:grid;place-items:center}#lang svg,#langs svg{display:block;border-radius:3px}#lang svg{width:24px;height:16px}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-width:0}.row>input{flex:1}.row>button{flex:none;white-space:nowrap}.row>div{flex:1}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
.meta,.city{color:var(--hint);font-size:14px;line-height:1.5}
h2{font-size:15px;font-weight:700;margin:24px 0 10px}
.msg{padding:36px 0;text-align:center;color:var(--hint)}
/* hero */
.hero{position:relative;margin:18px 0 6px;padding:20px 20px 0;overflow:hidden;border-radius:24px;background-color:hsl(var(--sh,200) 58% 74%);color:#fff;isolation:isolate}.hero .weather-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2;display:block}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,15,30,.58) 0%,rgba(7,15,30,.22) 58%,rgba(7,15,30,.04) 100%),linear-gradient(180deg,rgba(5,10,20,.04),rgba(5,10,20,.24));pointer-events:none;z-index:-1}.hero>*{position:relative;z-index:1}.hero #fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.hero .wi,.hero .globe{z-index:3}.hero .city{color:rgba(255,255,255,.82)}.hero .verdict{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.hero .city{color:#2c2c2c}.verdict{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;padding-right:60px}
.hero>svg.city-art{display:none}
.wi{position:absolute;top:16px;right:16px;color:#111}
.globe{position:absolute;left:12px;bottom:10px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}.globe svg{width:20px;height:20px}
.out{background:var(--panel);border-radius:20px;padding:16px;margin:10px 0}
.items{display:flex;flex-wrap:wrap;gap:8px}.items span{background:var(--bg);padding:7px 12px;border-radius:999px;font-size:14px}
.wl span{background:var(--panel)}.wl span button{background:none;padding:0 0 0 8px;color:var(--hint);font-size:13px}

 save=async arr=>{const g=new Map();for(const x of arr){const m=mon(x);if(!okM(m))continue;if(!g.has(m))g.set(m,[]);g.get(m).push(x)}let good=true;

  for(const m of[...saved.keys()])if(!g.has(m)){await st.del(pre+m);saved.delete(m);known.delete(m)}
  if(!await put(idx,JSON.stringify([...known].sort())))good=false;return good},
 load=async()=>{const ms=await jget(idx,null);

function friendlyError(err){
  const m=String(err&&err.message||err||'').trim();
  const generic=lang==='ru'?'Не удалось выполнить запрос. Попробуйте ещё раз.':'Something went wrong. Please try again.';
  if(/auth|401|unauthor/i.test(m))return lang==='ru'?'Не удалось подтвердить Telegram-сессию. Перезапустите мини-приложение.':'Could not verify your Telegram session. Reopen the mini app.';
  if(/429|rate.?limit|too many/i.test(m))return lang==='ru'?'Слишком много запросов. Попробуйте позже.':'Too many requests. Try again later.';
  if(/fetch|network|cannot reach|timeout|load failed|cors|abort/i.test(m))return lang==='ru'?'Нет связи с сервером. Проверьте подключение и повторите попытку.':'Could not reach the server. Check your connection and try again.';
  if(/typeerror|referenceerror|syntaxerror|undefined|null|reading|not a function|internal server|http 5\d\d/i.test(m))return generic;
  return m.length&&m.length<=160?m:generic;
}

function nvWxChip(){const b=$('nvWx');if(!b)return;b.setAttribute('aria-label',t('tw'));const lw=lastWeather;
  if(!lw){b.innerHTML=ico('cloud-sun')+'<b>'+esc(t('tw'))+'</b>';return}
  const c=lw.d.current,dl=lw.d.daily,tm=Date.parse(c.time+'Z'),rise=dl.sunrise&&dl.sunrise[0],set=dl.sunset&&dl.sunset[0],
    night=(rise&&set)?(tm<Date.parse(rise+'Z')||tm>Date.parse(set+'Z')):isNight(+c.time.slice(11,13));
  b.innerHTML=w(c.weather_code,night)[0]+'<b>'+String(Math.round(c.temperature_2m)).replace('-','−')+'°</b><span>'+esc(w(c.weather_code,night)[1])+'</span>';
  b.setAttribute('aria-label',t('tw')+': '+Math.round(c.temperature_2m)+'°'+(lw.name?', '+lw.name:''))}

const API_URL="https://gondola-hyperlink-showcase.ngrok-free.dev";   // ← адрес сервера ИИ (Cloudflare или ngrok), например https://abc123.ngrok-free.app
async function api(path,body){
  if(!API_URL)throw new Error(t('e0'));
  let r;try{r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?.initData||'','ngrok-skip-browser-warning':'1'},body:JSON.stringify({...body,lang})})}
  catch{throw new Error(t('e1'))}

  return r.json();
}

function wdShrink(file){return new Promise((ok,bad)=>{const img=new Image(),fr=new FileReader();

 img.onerror=fr.onerror=()=>{bad(new Error(wdL('Не получилось открыть фото. Попробуйте JPG или PNG.','Could not open the photo. Try JPG or PNG.')))};fr.onload=()=>{img.src=fr.result};fr.readAsDataURL(file)})}

function wear(f,rain,uv){
  let head,s;
  if(f<-10){head=1;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<0){head=2;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<8){head=3;s=['coat','scarf','shoes','pants']}
  else if(f<14){head=4;s=['jacket','pants','shoes']}
  else if(f<20){head=5;s=['hoodie','pants','shoes']}
  else if(f<26){head=6;s=['tee','pants','summershoes']}
  else{head=7;s=['tee','shorts','cap','summershoes']}
  if(rain>=50)s.push('rain');if(uv>=6&&!s.includes('cap'))s.push('cap');
  return {head,s};
}

  try{const j=await api('/outfit',{city:name||'',temp:Math.round(c.temperature_2m),feels:Math.round(f),tmin:Math.round(dl.temperature_2m_min[0]),tmax:Math.round(dl.temperature_2m_max[0]),
      wind:Math.round(c.wind_speed_10m),rain:dl.precipitation_probability_max[0]??0,uv:Math.round(dl.uv_index_max[0]??0),desc:w(c.weather_code)[1],items:wardrobe.map(wdBrief)});
    if(seq!==outSeq)return;box.innerHTML=`<div class="items">${j.outfit.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${j.tip?`<p class="meta" style="margin-top:10px">${esc(j.tip)}</p>`:''}`}
  catch(e){if(seq!==outSeq)return;console.warn('[NUVIO] Outfit advice unavailable:',e);box.innerHTML=`<div class="items">${s.map(id=>`<span>${t('s_'+id)}</span>`).join('')}</div><p class="meta" style="margin-top:10px">${t('gen')}</p>`}

async function load(lat,lon,name){
  $('app').innerHTML=`<p class="msg">${t('loadw')}</p>`;
  try{
    const u=new URL("https://api.open-meteo.com/v1/forecast");
    Object.entries({latitude:lat,longitude:lon,timezone:"auto",forecast_days:7,
      current:"temperature_2m,apparent_temperature,weather_code,wind_speed_10m",hourly:"temperature_2m,weather_code",
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset"}).forEach(([k,v])=>u.searchParams.set(k,v));
    const d=await (await fetch(u)).json();lastWeather={d,name};render(d,name);nvWxChip();
    st.set('place',JSON.stringify({lat,lon,name}));
  }catch{$('app').innerHTML=`<p class="msg">${t('errw')}</p>`}
}
function render(d,name){
  const c=d.current,dl=d.daily,f=c.apparent_temperature,{head}=wear(f,dl.precipitation_probability_max[0],dl.uv_index_max[0]),rise=dl.sunrise&&dl.sunrise[0],set=dl.sunset&&dl.sunset[0],tm=Date.parse(c.time+"Z"),night=(rise&&set)?(tm<Date.parse(rise+"Z")||tm>Date.parse(set+"Z")):isNight(+c.time.slice(11,13)),art=weatherArtwork(c.weather_code,night,new Date(),{wind:c.wind_speed_10m,temp:c.temperature_2m,lat:d.latitude,time:c.time,sunrise:rise,sunset:set}),scr=weatherScrim(art);

  const n=d.hourly.time.findIndex(x=>x>=c.time),sh=Math.round(215-Math.max(0,Math.min(1,(f+5)/29))*80),date=new Date().toLocaleDateString(loc(),{day:'numeric',month:'long'}),sunny=!night&&(c.weather_code<=1||(c.weather_code===2&&f>=15));
  const hours=d.hourly.time.slice(n,n+12).map((tm,i)=>`<div class="h">${tm.slice(11,16)}<i>${w(d.hourly.weather_code[n+i],isNight(+tm.slice(11,13)))[0]}</i><b>${Math.round(d.hourly.temperature_2m[n+i])}°</b></div>`).join('');
  const days=dl.time.map((x,i)=>`<div class="d"><span>${i?wdn(x+'T12:00:00')+', '+x.slice(8):t('today')}</span><span>${w(dl.weather_code[i])[0]}</span><small>${t('pr',dl.precipitation_probability_max[i]??0)}</small><b>${Math.round(dl.temperature_2m_min[i])}° / ${Math.round(dl.temperature_2m_max[i])}°</b></div>`).join('');
  $('app').innerHTML=`<section class="hero" style="--sh:${sh};--scrim:${scr[0]};--scrim2:${scr[1]}"><img class="weather-bg" src="${art}" alt="" aria-hidden="true"><div class="city">${esc(name||t('near'))}</div><div class="verdict">${t('v'+head)}</div><div class="hero-location">${esc(name||t('near'))}</div><div class="hero-title">${t('v'+head)}</div></section>
  <div class="out"><div class="out-heading">${t('outt')}</div><div id="outfit"></div></div>
  <div class="now"><span class="temp">${Math.round(c.temperature_2m)}°</span><span class="meta">${w(c.weather_code,night)[0]} ${w(c.weather_code,night)[1]}<br>${t('feels',Math.round(f),Math.round(c.wind_speed_10m))}</span></div>
  <h2>${t('h12')}</h2><div class="hours">${hours}</div><h2>${t('wk')}</h2>${days}`;

async function search(q){

 const used=new Set(),put=(it,l)=>{it.q=(l||[]).find(q=>!used.has(q.id))||null;if(it.q){used.add(it.q.id);SEEN.add(it.q.id)}};

 // without AI only prototypes picked by the number's own topics; numbers without topics in the plan stay empty
 R.items.forEach(it=>put(it,keep[it.n]??(it.t[5].length?it.c:[])));
 const gap=R.items.filter(it=>!it.q);
 if(!R.noai&&gap.length){R.stage=tr('Looking for more prototypes…','Ищу ещё прототипы…');drawRun();const ex2=[...SEEN,...R.items.flatMap(it=>it.c.map(q=>q.id))].slice(-350);
  await pool(gap,3,async it=>{try{const j=await api('/fipi',{action:'pick',exam:x.fipi,sub:S.id,n:it.n,k:5,exclude:ex2});it.c2=j.items||[]}catch{it.c2=[]}});if(V.run!==R)return;
  const k2=await aiAssign(x,S,gap.map(it=>[it.t,it.c2]));gap.forEach(it=>put(it,k2[it.n]))}
 if(R.mode==='train')await recall(R.ex,R.sid,R.items.map(it=>it.q).filter(Boolean));
 if(!R.items.some(it=>it.q)){R.fail=R.neterr||tr('No prototypes found. Try again later.','Прототипы не нашлись. Попробуйте позже.')}

 if(e.dataset.syF){const k=e.dataset.syF;if(k==='tex'){keepTutor();V.tutor.sid='';V.tutor.subject=''}V.f[k]=e.value;
  if(k==='pex'){V.f.psid='';V.f.pn=''}if(k==='psid')V.f.pn='';if(['pex','psid','pn'].includes(k)){V.f.pfound=0;V.fp=null;V.ai.st=null}render();return}

  const s=$('syMatS');if(s)s.innerHTML=busyBox(tr('Reading the file…','Читаю файл…'));let text=await fileText(f);

<script>/* NUVIO_DIGEST: утренняя сводка в чате с ботом. Бот не видит CloudStorage, поэтому приложение отправляет ему снимок:
   город, гардероб, активные цели, события «Плана» на 8 дней, лекарства, даты экзаменов. Отправляет, только когда снимок изменился
   (или раз в 12 часов), при открытии и при сворачивании приложения. Настройка — dg_cfg {on, at}; выключение стирает снимок на сервере. */
(function(){
const tx=(en,ru)=>lang==='en'?en:ru,K='dg_cfg',HHMM=/^([01]\d|2[0-3]):[0-5]\d$/;
let cfg=null,busy=false,msg='',bad=false;
const tz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch{return'UTC'}};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return s.length+':'+h};
const inTg=()=>!!(tg&&tg.initData);
/* sections of the morning summary the user wants (all by default); the bot sends only these */
const PARTS=[['weather','cloud-sun','Weather','Погода'],['wear','shirt','What to wear','Что надеть'],['goals','target','Goals','Цели'],['plan','calendar-range','Plans for today','Планы на день'],
  ['rem','alarm-clock','Reminders','Напоминания'],['meds','pill','Medicines','Лекарства'],['extra','graduation-cap','Tomorrow & exams','Завтра и экзамены'],['line','sparkles','Phrase of the day','Фраза дня']];
async function getCfg(){if(!cfg){const c=await jget(K,null),ok=PARTS.map(p=>p[0]),ps=c&&Array.isArray(c.parts)?c.parts.filter(p=>ok.includes(p)):ok;
  cfg={on:!c||c.on!==false,at:c&&HHMM.test(c.at)?c.at:'07:00',parts:ps.length?ps:ok}}return cfg}
const saveCfg=()=>st.set(K,JSON.stringify(cfg));

async function snapshot(){
  const d={},today=new Date(),days=[...Array(8)].map((_,i)=>dk(new Date(today.getFullYear(),today.getMonth(),today.getDate()+i)));
  try{const p=await jget('place',null);if(p&&isFinite(p.lat)&&isFinite(p.lon))d.place={lat:+p.lat,lon:+p.lon,name:p.name||''}}catch{}
  try{const w=(wardrobe&&wardrobe.length?wardrobe:((await jget('wardrobe',[]))||[]).map(wdNorm).filter(Boolean));d.wardrobe=w.slice(0,60).map(wdBrief)}catch{d.wardrobe=[]}
  try{d.goals=goals.filter(g=>!g.closed&&!reached(g)).slice(0,6).map(g=>{const st8=g.steps||[],last=st8.length?st8[st8.length-1].d:'';
    return{title:g.title,pct:pct(g),deadline:g.deadline||null,done:st8.filter(s=>s.done).slice(-3).map(s=>s.text),todo:st8.filter(s=>!s.done&&s.d===last).slice(0,2).map(s=>s.text)}})}catch{d.goals=[]}
  try{const ev=window.nuvioPlanEvents?await window.nuvioPlanEvents():[];
    d.events=ev.filter(e=>days.includes(e.date)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,40).map(e=>({date:e.date,time:e.time||'',title:e.title}));
    d.holidays=window.nuvioHoliday?days.map(k=>{const h=window.nuvioHoliday(k);return h&&h.kind!=='note'?{date:k,name:h.name}:null}).filter(Boolean):[]}catch{d.events=[];d.holidays=[]}
  try{d.meds=((await jget('h_med',{list:[]}))?.list||[]).slice(0,12).map(m=>({name:m.n,dose:m.dose||'',per:m.per||1}))}catch{d.meds=[]}
  try{const p=await jget('sy_prof',{}),ex=window.NUVIO_STUDY_EXAMS||[],dates=(p&&p.dates)||{};
    d.exams=Object.entries(dates).filter(([id,v])=>/^\d{4}-\d{2}-\d{2}$/.test(v)&&v>=days[0]&&(p.exams||[]).includes(id)).map(([id,v])=>{const x=ex.find(e=>e.id===id);return x?{name:lang==='en'&&x.en?x.en:x.name,date:v}:null}).filter(Boolean)}catch{d.exams=[]}
  try{d.week=await weekStats()}catch{d.week={}}
  return d}
/* week numbers for the Sunday summary: last 7 days, only what was recorded */
async function weekStats(){const w={},now=Date.now(),from=now-7*864e5,keys=[...Array(7)].map((_,i)=>dk(new Date(now-i*864e5)));
  try{w.wo=(typeof CX!=='undefined'&&CX.wo?CX.wo:[]).filter(x=>x.ts>=from).length}catch{}
  try{const sl=((typeof HL!=='undefined'&&HL.loaded?HL.d.sleep:await jget('h_sleep',[]))||[]).filter(e=>Array.isArray(e)&&e[0]*1000>=from&&+e[1]>0);
    if(sl.length){w.sleep=sl.reduce((a,e)=>a+e[1]/60,0)/sl.length;w.sleep_n=Math.min(7,sl.length)}}catch{}
  try{const m=(await (window.nuvioMoodEntries?window.nuvioMoodEntries():[])).filter(e=>keys.includes(e.date));if(m.length){w.mood=m.reduce((a,e)=>a+ +e.value,0)/m.length;w.mood_n=m.length}}catch{}
  try{const n=Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/864e5);w.study=((await jget('sy_s',[]))||[]).filter(x=>Array.isArray(x)&&x[0]>n-7&&x[0]<=n).reduce((a,x)=>a+(+x[1]||0),0)}catch{}
  try{const f=(await jget('fds',{}))||{},k=keys.map(x=>f[x]).filter(v=>Array.isArray(v)&&v[0]>0);if(k.length){w.kcal=k.reduce((a,v)=>a+v[0],0)/k.length;w.kcal_n=k.length}
    const tg_=typeof tgt==='function'?tgt():null;if(tg_&&tg_.kcal)w.kcal_t=tg_.kcal}catch{}
  try{if(window.nuvioStreak)w.streak=(await window.nuvioStreak()).cur}catch{}
  return w}

async function sync(extra){
  const c=await getCfg();if((!c.on&&!extra)||!inTg()||!API_URL)return null;
  const body={action:'sync',at:c.at,timezone:tz(),data:{...(await snapshot()),parts:c.parts},...(extra||{})},h=hash(JSON.stringify(body));
  if(!extra&&localStorage.getItem('dg_sent')===h&&Date.now()-(+localStorage.getItem('dg_at')||0)<12*36e5)return null;
  const j=await api('/digest',body);
  if(j&&j.on===false&&cfg.on){cfg.on=false;await saveCfg();draw()}
  try{localStorage.setItem('dg_sent',h);localStorage.setItem('dg_at',String(Date.now()))}catch{}
  return j}
const quiet=()=>sync().catch(()=>{});

function card(){const c=cfg||{on:true,at:'07:00'};
  return '<div class="sec dg-card" id="dgCard"><h2>'+tx('Morning summary','Утренняя сводка')+'</h2>'
   +'<p class="dg-sub">'+tx('Every morning the bot sends the weather, what to wear, your goals, plans and reminders for the day to the chat. On Sundays at 19:00 — your week in numbers.','Каждое утро бот пришлёт в чат погоду, что надеть, цели, планы и напоминания на день, а по воскресеньям в 19:00 — итоги недели.')+'</p>'
   +'<div class="seg"><button data-dg="on" class="'+(c.on?'on':'')+'">'+tx('On','Включена')+'</button><button data-dg="off" class="'+(c.on?'':'on')+'">'+tx('Off','Выключена')+'</button></div>'
   +(c.on?'<div class="dg-row"><label for="dgAt">'+tx('Send at','Время')+'</label><input type="time" id="dgAt" step="300" value="'+c.at+'"></div>'
     +'<p class="dg-ph">'+tx('What to send','Что присылать')+'</p><div class="dg-parts" role="group">'+PARTS.map(([k,ic,en,ru])=>'<label class="dg-pt"><input type="checkbox" data-dgp="'+k+'"'+(c.parts.includes(k)?' checked':'')+'>'+ico(ic)+'<span>'+tx(en,ru)+'</span></label>').join('')+'</div>'
     +'<div class="dg-btns"><button class="dg-test" data-dg="test"'+(busy?' disabled':'')+'>'+(busy?tx('Sending…','Отправляю…'):tx('Send now','Прислать сейчас'))+'</button><button class="dg-test" data-dg="week"'+(busy?' disabled':'')+'>'+tx('Week summary','Итоги недели')+'</button></div>':'')
   +'<p class="dg-msg'+(bad?' dg-bad':'')+'" role="status">'+esc(msg)+'</p>'
   +'<p class="dg-note">'+tx('For the summary the bot keeps your city (to about 1 km), wardrobe, goals, plans for the week, medicines and exam dates. Turn it off and this data is deleted from the server.','Для сводки бот хранит у себя город (с точностью около 1 км), гардероб, цели, планы на неделю, лекарства и даты экзаменов. Выключите сводку, и эти данные удалятся с сервера.')+'</p></div>'}
function draw(){const p=document.getElementById('p');if(!p)return;const old=document.getElementById('dgCard');
  if(old){old.outerHTML=card();return}const ch=document.getElementById('chan');if(ch)ch.insertAdjacentHTML('beforebegin',card())}
const say=(t,b)=>{msg=t;bad=!!b;draw()};

async function act(a){
  if(!inTg())return say(tx('Open the app in Telegram to set this up.','Откройте приложение в Телеграме, чтобы настроить сводку.'),true);
  const c=await getCfg();
  if(a==='on'||a==='off'){if((a==='on')===c.on)return;c.on=a==='on';await saveCfg();msg='';draw();
    try{if(c.on){await sync({enable:true});say(tx('Done. The next summary comes at ','Готово. Следующая сводка придёт в ')+c.at+'.')}
      else{await api('/digest',{action:'off'});localStorage.removeItem('dg_sent');say(tx('Turned off. The data was deleted from the server.','Выключено. Данные удалены с сервера.'))}}
    catch(e){say(e.message||tx('Could not save. Try again.','Не удалось сохранить. Попробуйте ещё раз.'),true)}return}
  if(a==='week'){if(busy)return;busy=true;msg='';draw();
    try{await sync({action:'test',kind:'week',enable:true});busy=false;say(tx('Sent. Check the chat with the bot.','Отправил. Загляните в чат с ботом.'))}
    catch(e){busy=false;say(tx('Nothing to sum up yet — add a few entries this week.','Пока нечего подводить — сделайте пару записей за неделю.'),true)}return}
  if(a==='test'){if(busy)return;busy=true;msg='';draw();
    try{await sync({action:'test',enable:true});busy=false;say(tx('Sent. Check the chat with the bot.','Отправил. Загляните в чат с ботом.'))}
    catch(e){busy=false;say(e.message||tx('Could not send. Try again later.','Не удалось отправить. Попробуйте позже.'),true)}}}

document.addEventListener('click',e=>{const b=e.target.closest('#dgCard [data-dg]');if(b){e.preventDefault();act(b.dataset.dg)}});
document.addEventListener('change',async e=>{const p=e.target.dataset&&e.target.dataset.dgp;if(!p)return;const c=await getCfg();
  const set=new Set(c.parts);e.target.checked?set.add(p):set.delete(p);
  if(!set.size){e.target.checked=true;return say(tx('Keep at least one section.','Оставьте хотя бы один раздел.'),true)}
  c.parts=PARTS.map(x=>x[0]).filter(k=>set.has(k));await saveCfg();msg='';bad=false;

<script>/* NUVIO_TABS_FIT: one label size for all 7 tabs, so the longest label (Здоровье / Nutrition) fits its column with
   the device's real font: SF on iPhone is wider than the fonts the CSS fallback was tuned on. 2px free space on each side. */
(function(){const nav=document.querySelector('.tabs');if(!nav)return;let raf=0;
function fit(){raf=0;const bs=[...nav.querySelectorAll('button[data-t]')];if(!bs.length||!bs[0].clientWidth)return;
  nav.style.setProperty('--tab-fs','11px');let k=1;
  for(const b of bs){const tn=[...b.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());if(!tn)continue;
    const r=document.createRange();r.selectNodeContents(tn);const w=r.getBoundingClientRect().width,room=b.clientWidth-4;if(w>room)k=Math.min(k,room/w)}
  nav.style.setProperty('--tab-fs',Math.max(8,Math.floor(11*k*10)/10)+'px')}
const later=()=>{if(!raf)raf=requestAnimationFrame(fit)};
if(window.ResizeObserver)new ResizeObserver(later).observe(nav);
new MutationObserver(later).observe(nav,{subtree:true,childList:true,characterData:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);later()})();
</script>

function svg(key){const[c0,c1,bl,sc,k]=P[key]||P['dark:default'],dark=key.startsWith('dark');
  let d='<linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="'+c0+'"/><stop offset="1" stop-color="'+c1+'"/></linearGradient>';
  bl.forEach(([x,y,r,c,o],i)=>{d+='<radialGradient id="b'+i+'"><stop offset="0" stop-color="'+c+'" stop-opacity="'+o+'"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></radialGradient>'});
  d+='<linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+sc[0]+'" stop-opacity="0"/><stop offset=".35" stop-color="'+sc[0]+'"/><stop offset=".6" stop-color="'+sc[1]+'"/><stop offset=".85" stop-color="'+sc[2]+'"/><stop offset="1" stop-color="'+sc[2]+'" stop-opacity="0"/></linearGradient>';

  let body='<rect width="400" height="860" fill="url(#g)"/>'+bl.map(([x,y,r],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#b'+i+')"/>').join('');

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice"><defs>'+d+'</defs>'+body+'</svg>'}
let last='';
function paint(){const h=document.documentElement,key=(h.dataset.theme==='dark'?'dark':'light')+':'+(P[(h.dataset.theme==='dark'?'dark':'light')+':'+h.dataset.palette]?h.dataset.palette:'default');

  const m=document.querySelector('meta[name=theme-color]');const c=(getComputedStyle(h).getPropertyValue('--nv-base').trim()||P[key][0]);if(m)m.setAttribute('content',c);

/* серия: дни подряд, когда было хоть что-то из записей (настроение, цель, тренировка, еда, учёба); значки за 3/7/14/30/60/100/365 дней.

  try{Object.entries((await jget('fds',{}))||{}).forEach(([k,v])=>{if(Array.isArray(v)&&v[0]>0)S.add(k)})}catch{}
  try{((await jget('sy_s',[]))||[]).forEach(z=>{if(Array.isArray(z)&&+z[1]>0){const d=new Date(z[0]*864e5);S.add(d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()))}})}catch{}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')renderHome()});
})();
</script>
<script>/* NUVIO_TG: возможности Telegram 7.0–8.0. Кнопка «Настройки» в меню бота → Профиль; полноэкранный режим (настройка fs_on,
   только телефоны; отступ сверху — --tg-safe-area-inset-top + --tg-content-safe-area-inset-top); «На главный экран» (addToHomeScreen).
   Карточка — в Профиле перед «Утренней сводкой». На старых версиях Telegram карточка не показывается. */
(function(){
const tg=window.Telegram&&Telegram.WebApp,tx=(en,ru)=>lang==='en'?en:ru,ver=v=>!!(tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast(v));
const mobile=()=>!!tg&&/^(ios|android|android_x)$/.test(tg.platform||''),FS='fs_on';let hs=ver('8.0')?'unknown':'unsupported',fsOn=false;
if(ver('7.0')&&tg.SettingsButton){try{tg.SettingsButton.show();tg.SettingsButton.onClick(()=>showTab('p'))}catch{}}
const fsClass=()=>document.documentElement.classList.toggle('nv-fs',!!(tg&&tg.isFullscreen));
function fsSet(on){if(!ver('8.0')||!mobile())return;try{on?tg.requestFullscreen():tg.exitFullscreen()}catch{}}
if(tg&&tg.onEvent){tg.onEvent('fullscreenChanged',()=>{fsClass();setTimeout(()=>moveGlass(document.querySelector('.tabs .on'),true),60);draw()});
  tg.onEvent('fullscreenFailed',()=>{fsOn=false;st.set(FS,'0');draw()});tg.onEvent('homeScreenAdded',()=>{hs='added';draw()});
  tg.onEvent('homeScreenChecked',e=>{if(e&&e.status){hs=e.status;draw()}})}
(async()=>{fsOn=(await st.get(FS))==='1';if(fsOn)fsSet(true);fsClass();
  if(ver('8.0')&&tg.checkHomeScreenStatus){try{tg.checkHomeScreenStatus(s=>{if(s){hs=s;draw()}})}catch{hs='unsupported'}}})();
function card(){if(!ver('8.0'))return'';const canFs=mobile(),canHs=hs!=='unsupported';if(!canFs&&!canHs)return'';
  return'<div class="sec tgx-card" id="tgxCard"><h2>Telegram</h2>'+
   (canFs?'<div class="tgx-row"><span><b>'+tx('Full screen','Полный экран')+'</b><small>'+tx('Without the Telegram header','Без шапки Telegram')+'</small></span><div class="seg"><button data-tgx="fs1" class="'+(fsOn?'on':'')+'">'+tx('On','Вкл')+'</button><button data-tgx="fs0" class="'+(fsOn?'':'on')+'">'+tx('Off','Выкл')+'</button></div></div>':'')+
   (canHs?'<div class="tgx-row"><span><b>'+tx('Home screen icon','Значок на экране телефона')+'</b><small>'+(hs==='added'?tx('Already added','Уже добавлен'):tx('Open NUVIO like an app','Открывать NUVIO как приложение'))+'</small></span>'+
     (hs==='added'?'':'<button class="p" data-tgx="home">'+ico('smartphone')+tx('Add','Добавить')+'</button>')+'</div>':'')+
   '<p class="tgx-note">'+tx('Settings are also in the bot menu (⋯ → Settings).','Настройки есть и в меню бота: ⋯ → «Настройки».')+'</p></div>'}
function draw(){const p=document.getElementById('p');if(!p)return;const old=document.getElementById('tgxCard'),h=card();
  if(old){old.outerHTML=h;return}if(!h)return;const at=document.getElementById('dgCard')||document.getElementById('chan');if(at)at.insertAdjacentHTML('beforebegin',h)}
const base=renderProfile;renderProfile=function(){base.apply(this,arguments);draw()};
document.addEventListener('click',async e=>{const b=e.target.closest('#tgxCard [data-tgx]');if(!b)return;const a=b.dataset.tgx;
  if(a==='fs1'||a==='fs0'){fsOn=a==='fs1';await st.set(FS,fsOn?'1':'0');fsSet(fsOn);draw()}
  if(a==='home'){try{tg.addToHomeScreen()}catch{}}});
})();
</script>
</body></html>
