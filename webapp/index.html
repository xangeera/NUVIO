async function api(path,body){
  if(!API_URL)throw new Error(t('e0'));
  let r;try{r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?.initData||'','ngrok-skip-browser-warning':'1'},body:JSON.stringify({...body,lang})})}
  catch{throw new Error(t('e1'))}
  if(r.status===429)throw new Error(t('e2'));if(r.status===401)throw new Error(t('e3'));if(!r.ok)throw new Error(t('e4'));
  return r.json();
}

function plateSvg(name){

  const P={1:[[60,48,1.7]],2:[[46,50,1.35],[75,46,1.35]],3:[[46,50,1.1],[76,44,1.1],[60,67,1.1]]}[ic.length],h=[...name].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
  return `<svg viewBox="0 0 120 90" aria-hidden="true"><rect width="120" height="90" fill="hsl(${h} 55% 90%)"/><circle cx="60" cy="48" r="38" fill="#fff" stroke="#e3e3e8" stroke-width="2"/><circle cx="60" cy="48" r="29" fill="#f7f7f9"/>${ic.map((k,i)=>`<g transform="translate(${P[i][0]} ${P[i][1]}) scale(${P[i][2]})">${ICON[k]}</g>`).join('')}</svg>`}

function openMap(){const u=`https://maps.open-meteo.com/?time=${iso(Date.now())}T1200#1/0.1/-0.1`;tg?.openLink?tg.openLink(u):window.open(u,'_blank')}
function startFx(code,f,wind){
  if(fxStop)fxStop();const cv=$('fx');if(!cv)return;
  const hero=cv.parentElement,ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W=1,H=1;const fit=()=>{W=hero.clientWidth;H=hero.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};fit();
  const ro=window.ResizeObserver?new ResizeObserver(fit):null;ro?.observe(hero);
  const kind=code>=96?'hail':code>=95?'storm':[71,73,75,77,85,86].includes(code)?'snow':(code>=51&&code<=67)||(code>=80&&code<=82)?'rain':code===45||code===48?'fog':(code===2||code===3)?'clouds':'';
  const heavy=[65,67,75,82,86,95,96,99].includes(code),lean=Math.min(1.5,wind/25);
  const N={rain:heavy?120:70,storm:130,snow:heavy?90:55,hail:60,fog:6,clouds:5}[kind]||0;
  const P=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*.8,r:Math.random()}));
  const S=wind>=25?Array.from({length:6+Math.min(8,Math.round(wind/6))},()=>({x:Math.random()*W,y:Math.random()*H*.7,l:30+Math.random()*50,v:2+Math.random()*3})):[];
  let flash=0,raf=0;
  function draw(ts){
    ctx.clearRect(0,0,W,H);
    if(kind==='rain'||kind==='storm'){ctx.strokeStyle='rgba(30,55,95,.5)';ctx.lineWidth=1.3;ctx.beginPath();
      P.forEach(p=>{const sx=1.5+lean*5;ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+sx*1.6,p.y+12*p.v);p.y+=10*p.v;p.x+=sx*.6*p.v;if(p.y>H){p.y=-12;p.x=Math.random()*(W+60)-60}});ctx.stroke()}
    if(kind==='storm'){if(Math.random()<.006)flash=1;if(flash>.02){ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;ctx.fillRect(0,0,W,H);flash*=.86}}
    if(kind==='snow'){ctx.fillStyle='rgba(255,255,255,.92)';P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.5+p.r*2.2,0,6.28);ctx.fill();
      p.y+=.9+p.v*1.2;p.x+=Math.sin(ts/900+p.r*10)*.6+lean*1.5;if(p.y>H){p.y=-6;p.x=Math.random()*W}if(p.x>W)p.x=0;if(p.x<0)p.x=W})}
    if(kind==='hail'){ctx.fillStyle='#fff';ctx.strokeStyle='rgba(110,130,155,.85)';ctx.lineWidth=1;P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2+p.r*1.8,0,6.28);ctx.fill();ctx.stroke();
      p.y+=11*p.v;p.x+=1+lean*3;if(p.y>H){p.y=-8;p.x=Math.random()*W}if(p.x>W)p.x=0})}
    if(kind==='fog'||kind==='clouds'){ctx.fillStyle=kind==='fog'?'rgba(255,255,255,.2)':'rgba(255,255,255,.3)';P.forEach(p=>{ctx.beginPath();
      ctx.ellipse(p.x,kind==='fog'?H*(.35+.5*p.r):10+p.r*H*.3,kind==='fog'?130:60+p.r*50,kind==='fog'?24:16+p.r*10,0,0,6.28);ctx.fill();p.x+=.25*p.v*(1+lean);if(p.x>W+140)p.x=-140})}
    if(S.length){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
      S.forEach(s=>{ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.l,s.y);s.x+=s.v*3+lean*2;if(s.x-s.l>W){s.x=0;s.y=Math.random()*H*.7}});ctx.stroke()}
  }
  const loop=ts=>{if(!cv.isConnected){fxStop();return}raf=requestAnimationFrame(loop);if(!document.hidden)draw(ts)};
  fxStop=()=>{cancelAnimationFrame(raf);ro?.disconnect();fxStop=null};
  still?draw(0):raf=requestAnimationFrame(loop);
}

let wardrobe=[],lastWeather=null,outSeq=0;

function wear(f,rain,uv){
  let head,s;
  if(f<-10){head=1;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<0){head=2;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<8){head=3;s=['coat','scarf','shoes','pants']}
  else if(f<14){head=4;s=['jacket','pants','shoes']}
  else if(f<20){head=5;s=['hoodie','pants','shoes']}
  else if(f<26){head=6;s=['tee','pants','summershoes']}
  else{head=7;s=['tee','shorts','cap','summershoes']}
  if(rain>=50)s.push('rain');if(uv>=6&&!s.includes('cap'))s.push('cap');
  return {head,s};
}
async function saveWardrobe(){await st.set('wardrobe',JSON.stringify(wardrobe));renderWardrobe();outfit()}
function renderWardrobe(){
  $('wardrobe').innerHTML=`<div class="row"><input id="wi" maxlength="80" placeholder="${t('wph')}" aria-label="${t('wph')}"><button class="p" id="wadd">${t('add')}</button></div>
  <div class="items wl" style="margin-top:12px">${wardrobe.length?wardrobe.map((x,i)=>`<span>${esc(x)}<button data-i="${i}" aria-label="${t('del')} ${esc(x)}">✕</button></span>`).join(''):`<p class="meta">${t('wempty')}</p>`}</div>`;
  const add=()=>{const parts=$('wi').value.split(/[,;\n]/).map(x=>x.trim().slice(0,80)).filter(Boolean);if(!parts.length)return;
    for(const p of parts)if(wardrobe.length<40&&!wardrobe.includes(p)&&JSON.stringify(wardrobe.concat(p)).length<3800)wardrobe.push(p);saveWardrobe()};
  $('wadd').onclick=add;$('wi').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  document.querySelectorAll('.wl button').forEach(b=>b.onclick=()=>{wardrobe.splice(+b.dataset.i,1);saveWardrobe()});
}

async function load(lat,lon,name){
  $('app').innerHTML=`<p class="msg">${t('loadw')}</p>`;
  try{
    const u=new URL("https://api.open-meteo.com/v1/forecast");
    Object.entries({latitude:lat,longitude:lon,timezone:"auto",forecast_days:7,
      current:"temperature_2m,apparent_temperature,weather_code,wind_speed_10m",hourly:"temperature_2m,weather_code",
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max"}).forEach(([k,v])=>u.searchParams.set(k,v));
    const d=await (await fetch(u)).json();lastWeather={d,name};render(d,name);
    st.set('place',JSON.stringify({lat,lon,name}));
  }catch{$('app').innerHTML=`<p class="msg">${t('errw')}</p>`}
}
function render(d,name){
  const c=d.current,dl=d.daily,f=c.apparent_temperature,{head}=wear(f,dl.precipitation_probability_max[0],dl.uv_index_max[0]),night=isNight(+c.time.slice(11,13));
  document.documentElement.style.setProperty("--hue",Math.round(Math.max(0,Math.min(1,(30-f)/50))*210+10));
  const n=d.hourly.time.findIndex(x=>x>=c.time),sh=Math.round(215-Math.max(0,Math.min(1,(f+5)/29))*80),date=new Date().toLocaleDateString(loc(),{day:'numeric',month:'long'}),sunny=!night&&(c.weather_code<=1||(c.weather_code===2&&f>=15));
  const hours=d.hourly.time.slice(n,n+12).map((tm,i)=>`<div class="h">${tm.slice(11,16)}<i>${w(d.hourly.weather_code[n+i],isNight(+tm.slice(11,13)))[0]}</i><b>${Math.round(d.hourly.temperature_2m[n+i])}°</b></div>`).join('');
  const days=dl.time.map((x,i)=>`<div class="d"><span>${i?wdn(x+'T12:00:00')+', '+x.slice(8):t('today')}</span><span>${w(dl.weather_code[i])[0]}</span><small>${t('pr',dl.precipitation_probability_max[i]??0)}</small><b>${Math.round(dl.temperature_2m_min[i])}° / ${Math.round(dl.temperature_2m_max[i])}°</b></div>`).join('');
  $('app').innerHTML=`<section class="hero" style="--sh:${sh}">${sunny?'<div class="rays"></div>':''}<canvas id="fx"></canvas>${icon(c.weather_code,f,night)}<div class="city">${t('wtw',date,esc(name||t('near')))}</div><div class="verdict">${t('v'+head)}</div>${CITY}<button class="globe" id="globe" aria-label="${t('map')}" title="${t('map')}">${GLOBE}</button></section>
  <div class="out"><div class="meta" style="margin-bottom:10px">${t('outt')}</div><div id="outfit"></div></div>
  <div class="now"><span class="temp">${Math.round(c.temperature_2m)}°</span><span class="meta">${w(c.weather_code,night)[0]} ${w(c.weather_code,night)[1]}<br>${t('feels',Math.round(f),Math.round(c.wind_speed_10m))}</span></div>
  <h2>${t('h12')}</h2><div class="hours">${hours}</div><h2>${t('wk')}</h2>${days}`;
  $('globe').onclick=openMap;startFx(c.weather_code,f,c.wind_speed_10m);outfit();

  try{const n=await askAI(g);g.steps=g.steps.filter(s=>s.done).slice(-6).concat(n);await saveGoal(g)}catch(e){aiErr=e.message}
  busy=false;renderGoals()}
const expected=g=>g.from+(g.to-g.from)*Math.min(1,Math.max(0,(Date.now()-g.created)/((endOf(g)-g.created)||1)));
const pct=g=>{const l=lastVal(g);if(g.to!=null&&l)return Math.max(0,Math.min(100,Math.round((l[1]-g.from)/(g.to-g.from)*100)));
  return g.steps.length?Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):0};
function timeline(g){
  const s=+sod(g.created),e=endOf(g),x=+sod(Date.now()),p=Math.max(0,Math.min(100,(x-s)/((e-s)||1)*100)),tot=Math.max(1,Math.round((e-s)/DAY)),left=Math.round((e-x)/DAY);
  return `<div class="tl"><span>${t('gs')}<b>${dm(s)}</b></span><div class="trk"><i style="width:${p}%"></i><u style="left:${p}%"></u></div><span style="text-align:right">${t('ge')}<b>${dm(e)}</b></span></div>
  <p class="meta" style="margin-top:8px">${x<s?t('tnot'):left>0?t('tleft',left,tot):left===0?t('tfin'):t('tover')}</p>`}
const geo=g=>{const a=sod(g.created),n=Math.max(1,Math.round((endOf(g)-a)/DAY)+1);
  return{n,k:n>62?7:1,m:+sod(g.made||g.created),today:+sod(Date.now()),dd:j=>{const d=new Date(a);d.setDate(a.getDate()+j);return +d}}};
const dayActs=(g,ts)=>{const k=+sod(ts),a=g.steps.filter(s=>s.at&&+sod(s.at)===k).map(s=>t('done',s.text));
  g.log.filter(x=>+sod(x[0])===k).forEach(x=>{if(x[1]!=null)a.push(t('mark',x[1],g.unit));if(x[2])a.push(t('note',x[2]))});return a};
const dayState=(g,G,ts)=>dayActs(g,ts).length?'ok':ts<G.m?'pre':ts<G.today?'miss':'fut';
function dayBlock(g){
  const G=geo(g),cells=[];
  for(let i=0;i<G.n;i+=G.k){const e=Math.min(G.n,i+G.k)-1,f=G.dd(i),l=G.dd(e);let s='';
    for(let j=i;j<=e;j++)if(dayState(g,G,G.dd(j))==='ok'){s='ok';break}
    if(!s)s=l<G.m?'pre':l<G.today?'miss':'fut';
    cells.push(`<button class="${s}${f<=G.today&&G.today<=l?' td':''}${selDay===i?' sel':''}" data-i="${i}" aria-label="${dm(f)}"></button>`)}
  let panel='';
  if(selDay!=null&&selDay<G.n){const e=Math.min(G.n,selDay+G.k)-1;
    panel=`<div class="wk"><h3>${G.k>1?t('wkh',dm(G.dd(selDay)),dm(G.dd(e))):dm(G.dd(selDay))}</h3>`+Array.from({length:e-selDay+1},(_,x)=>{
      const ts=G.dd(selDay+x),a=dayActs(g,ts),s=dayState(g,G,ts),tag={ok:t('tagok'),miss:t('tagmiss'),pre:t('tagpre'),fut:ts===G.today?t('tagnow'):t('tagfut')}[s];
      return `<div class="wd ${s}">${a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="wdh"><span>${wdn(ts)}, ${dm(ts)}</span><span class="tag">${tag}</span></div></div>`}).join('')+'</div>'}
  return `<div class="days">${cells.join('')}</div><p class="meta" style="margin-top:10px"><span class="lg ok"></span>${t('legok')}<span class="lg miss"></span>${t('legmiss')}${G.k>1?' · '+t('legwk'):''}</p>${panel}`}
function bindDays(g){$('dayblk').querySelectorAll('.days button').forEach(b=>b.onclick=()=>{selDay=selDay===+b.dataset.i?null:+b.dataset.i;$('dayblk').innerHTML=dayBlock(g);bindDays(g)})}

function renderGoals(){
  const el=$('g'),g=goals.find(x=>x.id===cur);
  if(adding){el.innerHTML=`<button id="back">${t('back')}</button><div class="gt" style="margin:14px 0 4px">${t('gnew')}</div>
    <label for="nt">${t('gq')}</label><input id="nt" maxlength="80" placeholder="${t('gph')}">
    <div class="row"><div><label for="nd0">${t('gs')}</label><input id="nd0" type="date" value="${iso(Date.now())}"></div><div><label for="nd">${t('ge')}</label><input id="nd" type="date"></div></div>
    <p class="meta" style="margin-top:16px">${t('gopt')}</p>
    <div class="row"><div><label for="nf">${t('gnow')}</label><input id="nf" inputmode="decimal" placeholder="85"></div><div><label for="nto">${t('gto')}</label><input id="nto" inputmode="decimal" placeholder="78"></div><div><label for="nu">${t('gu')}</label><input id="nu" maxlength="10" placeholder="kg"></div></div>
    <div class="row" style="margin-top:18px"><button class="p" id="create" style="flex:1">${t('gcreate')}</button></div>`;
    $('back').onclick=()=>{adding=false;renderGoals()};
    $('create').onclick=async()=>{
      const title=$('nt').value.trim(),from=num($('nf').value),to=num($('nto').value),s0=$('nd0').value,deadline=$('nd').value;
      if(!title)return $('nt').focus();if(!s0)return $('nd0').focus();if(!deadline||deadline<s0)return $('nd').focus();
      const m=from!=null&&to!=null&&from!==to,ng={id:Date.now().toString(36),title,unit:$('nu').value.trim(),from:m?from:null,to:m?to:null,deadline,created:+new Date(s0+'T00:00:00'),made:Date.now(),log:[],steps:[]};
      goals.push(ng);await saveGoal(ng);adding=false;cur=ng.id;selDay=null;refresh(ng)};return}
  if(!g){el.innerHTML=(goals.length?goals.map(x=>{const nx=x.steps.find(s=>!s.done);
      return `<div class="gcard" data-id="${x.id}"><div class="ring" style="--p:${pct(x)}"><span>${pct(x)}%</span></div><div><b>${esc(x.title)}</b><small>${dm(x.created)} → ${dm(endOf(x))}</small>${nx?`<small class="nx">${esc(nx.text)}</small>`:''}</div></div>`}).join('')
      :`<div class="ghero"><div class="gt">${t('gtitle')}</div><p class="meta">${t('gintro')}</p></div>`)+`<button class="p" id="add" style="width:100%;margin-top:6px">${t('gnew')}</button>`;
    el.querySelectorAll('.gcard').forEach(c=>c.onclick=()=>{cur=c.dataset.id;aiErr='';selDay=null;renderGoals()});
    $('add').onclick=()=>{adding=true;renderGoals()};return}
  const fi=g.steps.findIndex(s=>!s.done),l=lastVal(g),num_=g.to!=null;
  const list=busy?`<p class="msg">${t('busy')}</p>`:aiErr?`<div class="step">${esc(aiErr)}<br><button class="p" id="refresh">${t('retry')}</button></div>`
    :!g.steps.length?`<div class="step">${t('nosteps')}<br><button class="p" id="refresh">${t('getsteps')}</button></div>`
    :g.steps.map((s,i)=>`<div class="st ${s.done?'d':i===fi?'c':''}"><span class="dot">${s.done?'✓':i+1}</span><div>${esc(s.text)}${i===fi?`<br><button class="p" id="done">${t('ok')}</button>`:''}</div></div>`).join('')
      +`<button id="refresh" style="margin-top:8px">${fi<0?t('alldone'):t('upd')}</button>`;
  el.innerHTML=`<button id="back">${t('backall')}</button>
    <div class="ghero"><div class="gt">${esc(g.title)}</div>${timeline(g)}</div>
    <div class="sec"><h2>${t('prog',pct(g))}</h2><div class="scale">${g.steps.map((s,i)=>`<i class="${s.done?'d':i===fi?'c':''}"></i>`).join('')||'<i></i>'}</div>
    ${num_?`<p class="meta" style="margin-top:10px">${l?t('gnow2',l[1],esc(g.unit)):t('gnone')} · ${t('gplan',fmt(expected(g)))} · ${t('gtarget',g.to,esc(g.unit))}</p>`:''}
    <label style="margin-top:14px">${t('logt')}</label>${num_?`<input id="val" inputmode="decimal" placeholder="${t('valph')}" style="margin-bottom:8px">`:''}
    <div class="row"><input id="note" maxlength="200" placeholder="${t('logph')}"><button class="p" id="logit">${t('rec')}</button></div></div>
    <div class="sec"><h2>${t('days')}</h2><div id="dayblk">${dayBlock(g)}</div></div>
    <div class="sec"><h2>${t('steps')}</h2>${list}</div><button class="danger" id="del">${t('delg')}</button>`;
  bindDays(g);$('back').onclick=()=>{cur=null;renderGoals()};
  if($('refresh'))$('refresh').onclick=()=>refresh(g);
  if($('done'))$('done').onclick=async()=>{g.steps[fi].done=true;g.steps[fi].at=Date.now();await saveGoal(g);renderGoals()};
  $('logit').onclick=async()=>{const v=num_?num($('val').value):null,n=$('note').value.trim();if(v==null&&!n)return $(num_?'val':'note').focus();
    g.log.push([Date.now(),v,n]);await saveGoal(g);renderGoals()};
  $('del').onclick=async()=>{if(!await ask(t('delq')))return;
    goals=goals.filter(x=>x.id!==g.id);await st.del('g_'+g.id);await st.set('gi',JSON.stringify(goals.map(x=>x.id)));cur=null;renderGoals()};
}

/* ================= СТАРТ ================= */
async function init(){
  {const w0=await jget('wardrobe',[]);wardrobe=Array.isArray(w0)?w0:Object.values(w0).filter(v=>typeof v==='string');}renderWardrobe();
  const ids=await jget('gi',[]);goals=(await Promise.all(ids.map(i=>jget('g_'+i,null)))).filter(Boolean);renderGoals();renderProfile();loadFit();loadNx();
  const p=await jget('place',null);p?load(p.lat,p.lon,p.name):locate();
}
function setLang(l){lang=l;st.set('lang',l);applyStatic();renderWardrobe();renderGoals();renderProfile();renderFit();renderNx();if(lastWeather)render(lastWeather.d,lastWeather.name)}
(async()=>{
  $('mark').innerHTML=[...'nuvio'].map((c,i)=>`<span style="animation-delay:${i*.08}s">${c}</span>`).join('');
  const q0=new URLSearchParams(location.search).get('lang'),qp=(q0==='ru'||q0==='en')?q0:null,sv=await st.get('lang'),seen=await st.get('blang'),th=await st.get('theme');
  if(th)applyTheme(th);if(qp)st.set('blang',qp);const l=qp&&qp!==seen?qp:((sv==='ru'||sv==='en')?sv:qp);
  if(l==='ru'||l==='en'){lang=l;st.set('lang',l);applyStatic();moveGlass(document.querySelector('.tabs .on'),true);init();await new Promise(r=>setTimeout(r,1500))}
  else{$('langs').innerHTML=`<button data-l="ru" aria-label="Русский">${FLAG.ru}</button><button data-l="en" aria-label="English">${FLAG.en}</button>`;
    lang=await new Promise(r=>$('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>r(b.dataset.l)));
    st.set('lang',lang);applyStatic();moveGlass(document.querySelector('.tabs .on'),true);init()}
  $('splash').classList.add('off');
})();
</script></body></html>
