<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--hue:200;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#14181c);--hint:var(--tg-theme-hint-color,#6b7580);--panel:var(--tg-theme-secondary-bg-color,#f1f3f5);--accent:hsl(var(--hue) 70% 45%);--tint:hsl(var(--hue) 80% 50%/.14)}
*{box-sizing:border-box;margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
input,button{font:inherit;color:var(--text)}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:var(--panel)}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--panel);cursor:pointer}
button.p{background:var(--accent);color:#fff;font-weight:700}button.danger{color:#d33;background:none;margin-top:18px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;background:none;font-weight:600;color:var(--hint)}.tabs .on{background:var(--bg);color:var(--text)}
.tabs #lang{flex:none;width:46px;padding:0;display:grid;place-items:center}#lang svg,#langs svg{display:block;border-radius:3px}#lang svg{width:24px;height:16px}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-width:0}.row>input{flex:1}.row>button{flex:none;white-space:nowrap}.row>div{flex:1}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
.meta,.city{color:var(--hint);font-size:14px;line-height:1.5}
h2{font-size:15px;font-weight:700;margin:24px 0 10px}
.msg{padding:36px 0;text-align:center;color:var(--hint)}
/* hero */
.hero{position:relative;margin:18px 0 6px;padding:20px 20px 0;overflow:hidden;border-radius:24px;background-color:hsl(var(--sh,200) 58% 74%);color:#fff;isolation:isolate}.hero .weather-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2;display:block}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,15,30,.58) 0%,rgba(7,15,30,.22) 58%,rgba(7,15,30,.04) 100%),linear-gradient(180deg,rgba(5,10,20,.04),rgba(5,10,20,.24));pointer-events:none;z-index:-1}.hero>*{position:relative;z-index:1}.hero #fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.hero .wi,.hero .globe{z-index:3}.hero .city{color:rgba(255,255,255,.82)}.hero .verdict{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.hero .city{color:#2c2c2c}.verdict{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;padding-right:60px}
.hero>svg.city-art{display:none}
.wi{position:absolute;top:16px;right:16px;color:#111}
.globe{position:absolute;left:12px;bottom:10px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}.globe svg{width:20px;height:20px}
.out{background:var(--panel);border-radius:20px;padding:16px;margin:10px 0}
.items{display:flex;flex-wrap:wrap;gap:8px}.items span{background:var(--bg);padding:7px 12px;border-radius:999px;font-size:14px}
.wl span{background:var(--panel)}.wl span button{background:none;padding:0 0 0 8px;color:var(--hint);font-size:13px}

  const generic=lang==='ru'?'Не удалось выполнить запрос. Попробуйте ещё раз.':'Something went wrong. Please try again.';
  if(/auth|401|unauthor/i.test(m))return lang==='ru'?'Не удалось подтвердить Telegram-сессию. Перезапустите мини-приложение.':'Could not verify your Telegram session. Reopen the mini app.';
  if(/429|rate.?limit|too many/i.test(m))return lang==='ru'?'Слишком много запросов. Попробуйте позже.':'Too many requests. Try again later.';
  if(/fetch|network|cannot reach|timeout|load failed|cors|abort/i.test(m))return lang==='ru'?'Нет связи с сервером. Проверьте подключение и повторите попытку.':'Could not reach the server. Check your connection and try again.';
  if(/typeerror|referenceerror|syntaxerror|undefined|null|reading|not a function|internal server|http 5\d\d/i.test(m))return generic;
  return m.length&&m.length<=160?m:generic;
}

function weatherArtwork(code,night,now=new Date()){
  const month=now.getMonth(),day=now.getDate(),holiday=(month===11)||(month===0&&day<=8);
  if(code===45||code===48)return WEATHER_ART.fog;
  if([71,73,75,77,85,86].includes(code))return WEATHER_ART.snow;
  if((code>=51&&code<=67)||(code>=80&&code<=82)||code>=95)return WEATHER_ART.rain;

function wear(f,rain,uv){
  let head,s;
  if(f<-10){head=1;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<0){head=2;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<8){head=3;s=['coat','scarf','shoes','pants']}
  else if(f<14){head=4;s=['jacket','pants','shoes']}
  else if(f<20){head=5;s=['hoodie','pants','shoes']}
  else if(f<26){head=6;s=['tee','pants','summershoes']}
  else{head=7;s=['tee','shorts','cap','summershoes']}
  if(rain>=50)s.push('rain');if(uv>=6&&!s.includes('cap'))s.push('cap');
  return {head,s};
}

function googleCsv(path,text,o){

   else if(/heart.?rate|bpm/.test(p))put(o.pulses,d,v,'array');

}

async function saveReminder(){
 var title=q('h2title').value.trim(),date=q('h2date').value,time=q('h2time').value;if(!title||!date||!time){H2.error=tr('Fill title, date and time.','Заполните название, дату и время.');return renderHl()}
 var p={title:title,note:q('h2note').value.trim(),date:date,time:time,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',repeat:q('h2repeat').value};
 try{await api(H2.editing?'update':'create',Object.assign(p,H2.editing?{id:H2.editing.id}:{}));H2.editing=null;H2.error='';await loadReminders()}catch(e){H2.error=friendlyError(e);renderHl()}
}
async function handle(e){
 var b=e.target.closest('[data-h2]');if(!b)return;var a=b.dataset.h2;
 if(a==='home'){H2.view='home';H2.editing=null;H2.error='';return renderHl()}
 if(a==='import'){H2.view='import';H2.error='';return renderHl()}
 if(a==='reminders'){H2.view='reminders';H2.editing=null;return loadReminders()}
 if(a==='range'){H2.range=Number(b.dataset.v);return renderHl()}
 if(a==='importfile')return importFile();
 if(a==='saveReminder')return saveReminder();
 if(a==='cancelEdit'){H2.editing=null;H2.error='';return renderHl()}
 if(a==='editReminder'){H2.editing=H2.reminders.find(function(x){return x.id===Number(b.dataset.id)})||null;H2.error='';return renderHl()}
 if(a==='deleteReminder'){if(!confirm(tr('Delete this reminder?','Удалить это напоминание?')))return;try{await api('delete',{id:Number(b.dataset.id)});await loadReminders()}catch(err){H2.error=friendlyError(err);renderHl()}}
}
q('hl').addEventListener('click',handle);
(async function(){var saved=await st.get('h2_last_import');if(saved){try{H2.lastImport=JSON.parse(saved)}catch(e){H2.lastImport=saved}}})();
})();
</script>
</body></html>
