function vEdit(){const e=F.ed;
  return back('cust')+title(e.id?esc(e.name||t('fnew')):t('fnew'))+(F.err?`<p class="meta" style="margin-bottom:8px">${esc(F.err)}</p>`:'')

   <button class="wide" data-a="aiplan" style="margin-top:12px" ${F.busy?'disabled':''}>✨ ${F.busy?t('faib'):t('fai')}</button>
   ${e.ex.map((x,i)=>`<div class="sec"><h2>${esc(exn(x.id))} <button class="x" data-a="rmex" data-i="${i}" aria-label="${t('fdel')}">✕</button></h2>
     <div class="row3"><div><label>${t('fsets')}</label><input data-f="ex" data-i="${i}" data-k="sets" inputmode="numeric" value="${x.sets}"></div><div><label>${t('freps')}</label><input data-f="ex" data-i="${i}" data-k="reps" inputmode="numeric" value="${x.reps}"></div><div><label>${t('fkg')}</label><input data-f="ex" data-i="${i}" data-k="kg" inputmode="decimal" value="${x.kg||''}" placeholder="0"></div></div></div>`).join('')}

   <div class="row" style="margin-top:16px"><button class="p" style="flex:1" data-a="wsave">${t('fsave')}</button></div>${e.id?`<button class="danger" data-a="wdel">${t('fdel')}</button>`:''}`}
function vLib(){return back('menu')+title(t('flib'))+`<div class="chips2"><button class="${F.filt==='all'?'on':''}" data-a="filt" data-v="all">${t('fall')}</button>${GR.map(g=>`<button class="${F.filt===g?'on':''}" data-a="filt" data-v="${g}">${t('g_'+g)}</button>`).join('')}</div>
  <input data-f="q" placeholder="${t('fsearch')}" value="${esc(F.q)}" style="margin:10px 0"><div id="liblist" class="liblist">${libList('lib')}</div>`}
function vStart(){return back('menu')+title(t('fstart'))+(F.act?`<button class="p wide" data-a="resume" style="margin-bottom:10px">▶ ${t('fcont')} · ${esc(F.act.name)}</button>`:'')+(F.ws.length?`<p class="meta" style="margin-bottom:10px">${t('fchoose')}</p>`+F.ws.map(w=>`<div class="gcard" data-a="begin" data-id="${w.id}"><div><b>${esc(w.name)}</b><small>${w.groups.map(g=>t('g_'+g)).join(', ')} · ${w.ex.length} ${t('fex_n')}</small></div></div>`).join(''):`<p class="msg">${t('fnowo')}</p>`)}
function vAct(){const a=F.act;
  return `<div class="ghero"><div class="gt" style="text-align:center">${esc(a.name)}</div><div class="tmr" id="tm">${clk(Date.now()-a.start)}</div><p class="meta" style="text-align:center">${t('fstarted')} ${hm(a.start)}</p></div>
  ${a.ex.map((x,ei)=>`<div class="sec"><h2>${esc(exn(x.id))}${F.pr[x.id]?` <small class="meta">· ${t('f1rm')} ${F.pr[x.id]} ${t('fkgu')}</small>`:''}</h2>
    ${x.sets.map((s,si)=>`<div class="setr"><span>${si+1}</span><input data-f="set" data-e="${ei}" data-s="${si}" data-k="kg" inputmode="decimal" value="${s.kg||''}" placeholder="${t('fkg')}" aria-label="${t('fkg')}"><input data-f="set" data-e="${ei}" data-s="${si}" data-k="reps" inputmode="numeric" value="${s.reps||''}" placeholder="${t('freps')}" aria-label="${t('freps')}"><button class="ck${s.done?' on':''}" data-a="ck" data-e="${ei}" data-s="${si}">✓</button></div>`).join('')}
    <button data-a="addset" data-e="${ei}" style="margin-top:8px">${t('faddset')}</button></div>`).join('')}

function renderFit(){
  const el=$('ft');clearInterval(F.tk);
  const V={onb:vOnb,menu:vMenu,hist:vHist,cust:vCust,edit:vEdit,lib:vLib,start:vStart,act:vAct,report:vReport}[F.v];
  el.innerHTML=F.loaded?V():`<p class="msg">…</p>`;
  if(F.v==='act')F.tk=setInterval(()=>{const x=$('tm');if(x)x.textContent=clk(Date.now()-F.act.start)},1000);
  if(F.v==='report')$('fai').innerHTML=aiHtml(F.ai);
  if(F.lv!==F.v){F.lv=F.v;scrollTo(0,0)}
}
async function review(){const s=F.rep,m=sumry(s);F.ai={loading:true};$('fai').innerHTML=aiHtml(F.ai);const b=$('faibtn');if(b)b.hidden=true;
  try{F.ai={j:await api('/fitness',{mode:'review',name:s.name,minutes:Math.round(m.dur/60000),volume:Math.round(m.vol),profile:F.prof,
    exercises:m.ex.map(x=>({name:exn(x.id),sets:x.sets,e1rm:x.best,record:(s.pr||[]).includes(x.id)}))})}}catch(e){F.ai={err:e.message}}
  if(F.v==='report'&&F.rep===s){$('fai').innerHTML=aiHtml(F.ai);if(b&&F.ai.err)b.hidden=false}}
async function finishWo(){
  const a=F.act,done={id:Date.now().toString(36),name:a.name,start:a.start,end:Date.now(),pr:[],ex:a.ex.map(x=>({id:x.id,sets:x.sets.filter(s=>s.done&&s.reps>0).map(s=>[s.kg||0,s.reps])})).filter(x=>x.sets.length)};
  if(!done.ex.length){if(!await ask(t('fnosets')))return;F.act=null;await saveAct();F.v='menu';return renderFit()}
  sumry(done).ex.forEach(x=>{const old=F.pr[x.id];if(x.best>0){if(old&&x.best>old)done.pr.push(x.id);if(!old||x.best>old)F.pr[x.id]=x.best}});
  await st.set('fh_'+done.id,JSON.stringify(done));F.hid.push(done.id);while(F.hid.length>300)await st.del('fh_'+F.hid.shift());
  await st.set('fhi',JSON.stringify(F.hid));await st.set('fpr',JSON.stringify(F.pr));F.act=null;await saveAct();
  F.rep=done;F.from='act';F.ai=null;F.v='report';renderFit();review()}
const fa={
  menu(){F.v='menu';renderFit()},cust(){F.v='cust';renderFit()},prev(){F.step=1;renderFit()},
  pick(d){F.tmp[d.k]=d.v;renderFit()},
  next1(){const h=num(F.tmp.h),w=num(F.tmp.w);if(!(h>=100&&h<=250)||!(w>=30&&w<=300)||!F.tmp.body)return note(t('fneed'));F.tmp.h=h;F.tmp.w=w;F.step=2;renderFit()},
  async fin(){if(!F.tmp.goal)return note(t('fgneed'));F.prof={h:F.tmp.h,w:F.tmp.w,body:F.tmp.body,goal:F.tmp.goal};await st.set('fit_profile',JSON.stringify(F.prof));F.v='menu';renderFit()},
  editprof(){F.tmp={...F.prof};F.step=1;F.v='onb';renderFit()},
  async go(d){F.q='';F.filt='all';F.open=null;F.tech=null;F.err='';
    if(d.v==='hist')F.hs=(await Promise.all(F.hid.slice(-25).reverse().map(i=>jget('fh_'+i,null)))).filter(Boolean);
    F.v=d.v;renderFit()},
  hopen(d){F.rep=F.hs.find(s=>s.id===d.id);F.from='hist';F.ai=null;F.v='report';renderFit()},
  review,
  filt(d){F.filt=d.v;renderFit()},
  lopen(d){F.open=F.open===d.v?null:d.v;F.tech=null;$('liblist').innerHTML=libList('lib')},
  async tech(d){F.tech={id:d.v,loading:true};$('liblist').innerHTML=libList('lib');
    try{F.tech={id:d.v,j:await api('/fitness',{mode:'tech',exercise:exn(d.v),profile:F.prof})}}catch(e){F.tech={id:d.v,err:e.message}}$('liblist').innerHTML=libList('lib')},
  wnew(){F.ed={name:'',groups:[],ex:[]};F.pick=false;F.err='';F.q='';F.v='edit';renderFit()},
  wedit(d){F.ed=JSON.parse(JSON.stringify(F.ws.find(w=>w.id===d.id)));F.pick=false;F.err='';F.q='';F.v='edit';renderFit()},
  tg(d){const g=F.ed.groups,i=g.indexOf(d.v);i<0?g.push(d.v):g.splice(i,1);renderFit()},
  togpick(){F.pick=!F.pick;renderFit()},
  addex(d){if(!F.ed.ex.find(x=>x.id===d.v))F.ed.ex.push({id:d.v,sets:3,reps:10,kg:0});renderFit()},
  rmex(d){F.ed.ex.splice(+d.i,1);renderFit()},
  async aiplan(){const e=F.ed;if(!e.groups.length)return note(t('fneedg'));F.busy=true;F.err='';renderFit();
    try{const j=await api('/fitness',{mode:'plan',groups:e.groups.map(g=>t('g_'+g)),allowed:Object.values(EX).filter(x=>e.groups.includes(x.g)).map(x=>({id:x.id,name:x[lang]})),profile:F.prof,pr:F.pr});
      const ok=(j.exercises||[]).filter(x=>EX[x.id]&&e.groups.includes(EX[x.id].g)).map(x=>({id:x.id,sets:cl(x.sets,1,8,3),reps:cl(x.reps,1,30,10),kg:Math.max(0,+x.kg||0)}));
      if(ok.length){e.ex=ok;if(!e.name&&j.name)e.name=String(j.name).slice(0,40)}}catch(er){F.err=er.message}
    F.busy=false;renderFit()},
  async wsave(){const e=F.ed;if(!e.name.trim()||!e.ex.length)return note(t('fneedn'));
    const w={id:e.id||Date.now().toString(36),name:e.name.trim(),groups:e.groups.length?e.groups:[...new Set(e.ex.map(x=>EX[x.id]?.g).filter(Boolean))],ex:e.ex.map(x=>({id:x.id,sets:cl(x.sets,1,10,3),reps:cl(x.reps,1,50,10),kg:Math.max(0,+x.kg||0)}))};
    const i=F.ws.findIndex(x=>x.id===w.id);i<0?F.ws.push(w):F.ws[i]=w;await st.set('fw_'+w.id,JSON.stringify(w));await saveIdx();F.v='cust';renderFit()},
  async wdel(){if(!await ask(t('fdq')))return;F.ws=F.ws.filter(x=>x.id!==F.ed.id);await st.del('fw_'+F.ed.id);await saveIdx();F.v='cust';renderFit()},
  async begin(d){if(F.act&&!await ask(t('ffq')))return;const w=F.ws.find(x=>x.id===d.id);
    F.act={wid:w.id,name:w.name,start:Date.now(),ex:w.ex.map(x=>({id:x.id,sets:Array.from({length:x.sets},()=>({kg:x.kg,reps:x.reps,done:false}))}))};await saveAct();F.v='act';renderFit()},
  resume(){F.v='act';renderFit()},
  ck(d,b){const s=F.act.ex[d.e].sets[d.s];s.done=!s.done;b.classList.toggle('on',s.done);tg?.HapticFeedback?.impactOccurred?.('medium');saveAct()},
  addset(d){const x=F.act.ex[d.e],l=x.sets.at(-1)||{kg:0,reps:10};x.sets.push({kg:l.kg,reps:l.reps,done:false});saveAct();renderFit()},
  async finish(){if(await ask(t('ffq')))finishWo()}};
const fi={h(v){F.tmp.h=v},w(v){F.tmp.w=v},name(v){F.ed.name=v},ex(v,d){F.ed.ex[d.i][d.k]=v===''?0:num(v)||0},
  q(v){F.q=v;$('liblist').innerHTML=libList(F.v==='edit'?'add':'lib')},
  set(v,d){F.act.ex[d.e].sets[d.s][d.k]=num(v)||0;clearTimeout(F.pt);F.pt=setTimeout(saveAct,500)}};

function icon(code,f,night){
  const k=code>=95?'thunder':[71,73,75,77,85,86].includes(code)?'snow':(code>=51&&code<=67)||(code>=80&&code<=82)?'rain':code===45||code===48?'fog'

  const heavy=[65,67,75,82,86,95,96,99].includes(code),lean=Math.min(1.5,wind/25);
  const N={rain:heavy?120:70,storm:130,snow:heavy?90:55,hail:60,fog:6,clouds:5}[kind]||0;
  const P=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*.8,r:Math.random()}));
  const S=wind>=25?Array.from({length:6+Math.min(8,Math.round(wind/6))},()=>({x:Math.random()*W,y:Math.random()*H*.7,l:30+Math.random()*50,v:2+Math.random()*3})):[];
  let flash=0,raf=0;
  function draw(ts){
    ctx.clearRect(0,0,W,H);
    if(kind==='rain'||kind==='storm'){ctx.strokeStyle='rgba(30,55,95,.5)';ctx.lineWidth=1.3;ctx.beginPath();
      P.forEach(p=>{const sx=1.5+lean*5;ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+sx*1.6,p.y+12*p.v);p.y+=10*p.v;p.x+=sx*.6*p.v;if(p.y>H){p.y=-12;p.x=Math.random()*(W+60)-60}});ctx.stroke()}
    if(kind==='storm'){if(Math.random()<.006)flash=1;if(flash>.02){ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;ctx.fillRect(0,0,W,H);flash*=.86}}
    if(kind==='snow'){ctx.fillStyle='rgba(255,255,255,.92)';P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.5+p.r*2.2,0,6.28);ctx.fill();
      p.y+=.9+p.v*1.2;p.x+=Math.sin(ts/900+p.r*10)*.6+lean*1.5;if(p.y>H){p.y=-6;p.x=Math.random()*W}if(p.x>W)p.x=0;if(p.x<0)p.x=W})}
    if(kind==='hail'){ctx.fillStyle='#fff';ctx.strokeStyle='rgba(110,130,155,.85)';ctx.lineWidth=1;P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2+p.r*1.8,0,6.28);ctx.fill();ctx.stroke();
      p.y+=11*p.v;p.x+=1+lean*3;if(p.y>H){p.y=-8;p.x=Math.random()*W}if(p.x>W)p.x=0})}
    if(kind==='fog'||kind==='clouds'){ctx.fillStyle=kind==='fog'?'rgba(255,255,255,.2)':'rgba(255,255,255,.3)';P.forEach(p=>{ctx.beginPath();
      ctx.ellipse(p.x,kind==='fog'?H*(.35+.5*p.r):10+p.r*H*.3,kind==='fog'?130:60+p.r*50,kind==='fog'?24:16+p.r*10,0,0,6.28);ctx.fill();p.x+=.25*p.v*(1+lean);if(p.x>W+140)p.x=-140})}
    if(S.length){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
      S.forEach(s=>{ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.l,s.y);s.x+=s.v*3+lean*2;if(s.x-s.l>W){s.x=0;s.y=Math.random()*H*.7}});ctx.stroke()}

}

function wear(f,rain,uv){
  let head,s;
  if(f<-10){head=1;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<0){head=2;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<8){head=3;s=['coat','scarf','shoes','pants']}
  else if(f<14){head=4;s=['jacket','pants','shoes']}
  else if(f<20){head=5;s=['hoodie','pants','shoes']}
  else if(f<26){head=6;s=['tee','pants','summershoes']}
  else{head=7;s=['tee','shorts','cap','summershoes']}
  if(rain>=50)s.push('rain');if(uv>=6&&!s.includes('cap'))s.push('cap');

}

    panel=`<div class="wk"><h3>${G.k>1?t('wkh',dm(G.dd(selDay)),dm(G.dd(e))):dm(G.dd(selDay))}</h3>`+Array.from({length:e-selDay+1},(_,x)=>{
      const ts=G.dd(selDay+x),a=dayActs(g,ts),s=dayState(g,G,ts),tag={ok:t('tagok'),miss:t('tagmiss'),pre:t('tagpre'),fut:ts===G.today?t('tagnow'):t('tagfut')}[s];
      return `<div class="wd ${s}">${a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="wdh"><span>${wdn(ts)}, ${dm(ts)}</span><span class="tag">${tag}</span></div></div>`}).join('')+'</div>'}
  return `<div class="days">${cells.join('')}</div><p class="meta" style="margin-top:10px"><span class="lg ok"></span>${t('legok')}<span class="lg miss"></span>${t('legmiss')}${G.k>1?' · '+t('legwk'):''}</p>${panel}`}
function bindDays(g){$('dayblk').querySelectorAll('.days button').forEach(b=>b.onclick=()=>{selDay=selDay===+b.dataset.i?null:+b.dataset.i;$('dayblk').innerHTML=dayBlock(g);bindDays(g)})}

function renderGoals(){
  const el=$('g'),g=goals.find(x=>x.id===cur);
  if(adding){el.innerHTML=`<button id="back">${t('back')}</button><div class="gt" style="margin:14px 0 4px">${t('gnew')}</div>
    <label for="nt">${t('gq')}</label><input id="nt" maxlength="80" placeholder="${t('gph')}">
    <div class="row"><div><label for="nd0">${t('gs')}</label><input id="nd0" type="date" value="${iso(Date.now())}"></div><div><label for="nd">${t('ge')}</label><input id="nd" type="date"></div></div>
    <p class="meta" style="margin-top:16px">${t('gopt')}</p>
    <div class="row"><div><label for="nf">${t('gnow')}</label><input id="nf" inputmode="decimal" placeholder="85"></div><div><label for="nto">${t('gto')}</label><input id="nto" inputmode="decimal" placeholder="78"></div><div><label for="nu">${t('gu')}</label><input id="nu" maxlength="10" placeholder="kg"></div></div>
    <div class="row" style="margin-top:18px"><button class="p" id="create" style="flex:1">${t('gcreate')}</button></div>`;
    $('back').onclick=()=>{adding=false;renderGoals()};
    $('create').onclick=async()=>{
      const title=$('nt').value.trim(),from=num($('nf').value),to=num($('nto').value),s0=$('nd0').value,deadline=$('nd').value;
      if(!title)return $('nt').focus();if(!s0)return $('nd0').focus();if(!deadline||deadline<s0)return $('nd').focus();
      const m=from!=null&&to!=null&&from!==to,ng={id:Date.now().toString(36),title,unit:$('nu').value.trim(),from:m?from:null,to:m?to:null,deadline,created:+new Date(s0+'T00:00:00'),made:Date.now(),log:[],steps:[]};
      goals.push(ng);await saveGoal(ng);adding=false;cur=ng.id;selDay=null;refresh(ng)};return}
  if(!g){el.innerHTML=(goals.length?goals.map(x=>{const nx=x.steps.find(s=>!s.done);
      return `<div class="gcard" data-id="${x.id}"><div class="ring" style="--p:${pct(x)}"><span>${pct(x)}%</span></div><div><b>${esc(x.title)}</b><small>${dm(x.created)} → ${dm(endOf(x))}</small>${nx?`<small class="nx">${esc(nx.text)}</small>`:''}</div></div>`}).join('')
      :`<div class="ghero"><div class="gt">${t('gtitle')}</div><p class="meta">${t('gintro')}</p></div>`)+`<button class="p" id="add" style="width:100%;margin-top:6px">${t('gnew')}</button>`;
    el.querySelectorAll('.gcard').forEach(c=>c.onclick=()=>{cur=c.dataset.id;aiErr='';selDay=null;renderGoals()});
    $('add').onclick=()=>{adding=true;renderGoals()};return}
  const fi=g.steps.findIndex(s=>!s.done),l=lastVal(g),num_=g.to!=null;
  const list=busy?`<p class="msg">${t('busy')}</p>`:aiErr?`<div class="step">${esc(aiErr)}<br><button class="p" id="refresh">${t('retry')}</button></div>`
    :!g.steps.length?`<div class="step">${t('nosteps')}<br><button class="p" id="refresh">${t('getsteps')}</button></div>`
    :g.steps.map((s,i)=>`<div class="st ${s.done?'d':i===fi?'c':''}"><span class="dot">${s.done?'✓':i+1}</span><div>${esc(s.text)}${i===fi?`<br><button class="p" id="done">${t('ok')}</button>`:''}</div></div>`).join('')
      +`<button id="refresh" style="margin-top:8px">${fi<0?t('alldone'):t('upd')}</button>`;
  el.innerHTML=`<button id="back">${t('backall')}</button>
    <div class="ghero"><div class="gt">${esc(g.title)}</div>${timeline(g)}</div>
    <div class="sec"><h2>${t('prog',pct(g))}</h2><div class="scale">${g.steps.map((s,i)=>`<i class="${s.done?'d':i===fi?'c':''}"></i>`).join('')||'<i></i>'}</div>
    ${num_?`<p class="meta" style="margin-top:10px">${l?t('gnow2',l[1],esc(g.unit)):t('gnone')} · ${t('gplan',fmt(expected(g)))} · ${t('gtarget',g.to,esc(g.unit))}</p>`:''}
    <label style="margin-top:14px">${t('logt')}</label>${num_?`<input id="val" inputmode="decimal" placeholder="${t('valph')}" style="margin-bottom:8px">`:''}
    <div class="row"><input id="note" maxlength="200" placeholder="${t('logph')}"><button class="p" id="logit">${t('rec')}</button></div></div>
    <div class="sec"><h2>${t('days')}</h2><div id="dayblk">${dayBlock(g)}</div></div>
    <div class="sec"><h2>${t('steps')}</h2>${list}</div><button class="danger" id="del">${t('delg')}</button>`;
  bindDays(g);$('back').onclick=()=>{cur=null;renderGoals()};
  if($('refresh'))$('refresh').onclick=()=>refresh(g);
  if($('done'))$('done').onclick=async()=>{g.steps[fi].done=true;g.steps[fi].at=Date.now();await saveGoal(g);renderGoals()};
  $('logit').onclick=async()=>{const v=num_?num($('val').value):null,n=$('note').value.trim();if(v==null&&!n)return $(num_?'val':'note').focus();
    g.log.push([Date.now(),v,n]);await saveGoal(g);renderGoals()};
  $('del').onclick=async()=>{if(!await ask(t('delq')))return;
    goals=goals.filter(x=>x.id!==g.id);await st.del('g_'+g.id);await st.set('gi',JSON.stringify(goals.map(x=>x.id)));cur=null;renderGoals()};
}

/* ================= СТАРТ ================= */
async function init(){
  {const w0=await jget('wardrobe',[]);wardrobe=Array.isArray(w0)?w0:Object.values(w0).filter(v=>typeof v==='string');}renderWardrobe();
  const ids=await jget('gi',[]);goals=(await Promise.all(ids.map(i=>jget('g_'+i,null)))).filter(Boolean);renderGoals();renderProfile();loadFit();
  const p=await jget('place',null);p?load(p.lat,p.lon,p.name):locate();
}
function setLang(l){lang=l;st.set('lang',l);applyStatic();renderWardrobe();renderGoals();renderProfile();renderFit();if(lastWeather)render(lastWeather.d,lastWeather.name)}
(async()=>{
  $('mark').innerHTML=[...'nuvio'].map((c,i)=>`<span style="animation-delay:${i*.08}s">${c}</span>`).join('');
  const q0=new URLSearchParams(location.search).get('lang'),qp=(q0==='ru'||q0==='en')?q0:null,sv=await st.get('lang'),seen=await st.get('blang'),th=await st.get('theme');
  if(th)applyTheme(th);if(qp)st.set('blang',qp);const l=qp&&qp!==seen?qp:((sv==='ru'||sv==='en')?sv:qp);
  if(l==='ru'||l==='en'){lang=l;st.set('lang',l);applyStatic();moveGlass(document.querySelector('.tabs .on'),true);init();await new Promise(r=>setTimeout(r,1500))}
  else{$('langs').innerHTML=`<button data-l="ru" aria-label="Русский">${FLAG.ru}</button><button data-l="en" aria-label="English">${FLAG.en}</button>`;
    lang=await new Promise(r=>$('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>r(b.dataset.l)));
    st.set('lang',lang);applyStatic();moveGlass(document.querySelector('.tabs .on'),true);init()}
  $('splash').classList.add('off');
})();
</script></body></html>
