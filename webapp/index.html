<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--hue:200;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#14181c);--hint:var(--tg-theme-hint-color,#6b7580);--panel:var(--tg-theme-secondary-bg-color,#f1f3f5);--accent:hsl(var(--hue) 70% 45%);--tint:hsl(var(--hue) 80% 50%/.14)}
*{box-sizing:border-box;margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
input,button{font:inherit;color:var(--text)}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:var(--panel)}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--panel);cursor:pointer}
button.p{background:var(--accent);color:#fff;font-weight:700}button.danger{color:#d33;background:none;margin-top:18px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;background:none;font-weight:600;color:var(--hint)}.tabs .on{background:var(--bg);color:var(--text)}
.tabs #lang{flex:none;width:46px;padding:0;display:grid;place-items:center}#lang svg,#langs svg{display:block;border-radius:3px}#lang svg{width:24px;height:16px}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-width:0}.row>input{flex:1}.row>button{flex:none;white-space:nowrap}.row>div{flex:1}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
.meta,.city{color:var(--hint);font-size:14px;line-height:1.5}
h2{font-size:15px;font-weight:700;margin:24px 0 10px}
.msg{padding:36px 0;text-align:center;color:var(--hint)}
/* hero */
.hero{position:relative;margin:18px 0 6px;padding:20px 20px 0;overflow:hidden;border-radius:24px;background:linear-gradient(hsl(var(--sh,200) 65% 82%),hsl(var(--sh,200) 50% 66%));color:#111;transition:background .6s}
.hero .city{color:#2c2c2c}.verdict{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;padding-right:60px}
.hero>svg.city-art{display:block;width:calc(100% + 40px);height:130px;margin:14px -20px 0}
.wi{position:absolute;top:16px;right:16px;color:#111}
.globe{position:absolute;left:12px;bottom:10px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}.globe svg{width:20px;height:20px}
.out{background:var(--panel);border-radius:20px;padding:16px;margin:10px 0}
.items{display:flex;flex-wrap:wrap;gap:8px}.items span{background:var(--bg);padding:7px 12px;border-radius:999px;font-size:14px}
.wl span{background:var(--panel)}.wl span button{background:none;padding:0 0 0 8px;color:var(--hint);font-size:13px}
.now{display:flex;align-items:center;gap:14px;margin:16px 0 4px}.temp{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--accent)}.now .meta{font-size:15px;line-height:1.55}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.h{flex:0 0 58px;text-align:center;background:var(--panel);border-radius:14px;padding:10px 0;font-size:13px}.h b{display:block;font-size:16px}.h i{font-style:normal;display:block;font-size:20px;margin:4px 0}
.d{display:grid;grid-template-columns:78px 28px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--panel);font-size:15px}.d small{color:var(--hint)}
/* goals */
#g{--accent:hsl(222 72% 52%);--tint:hsl(222 85% 55%/.12)}

const API_URL="https://gondola-hyperlink-showcase.ngrok-free.dev";   // ← адрес сервера ИИ (Cloudflare или ngrok), например https://abc123.ngrok-free.app
async function api(path,body){
  if(!API_URL)throw new Error(t('e0'));
  let r;try{r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?.initData||'','ngrok-skip-browser-warning':'1'},body:JSON.stringify({...body,lang})})}
  catch{throw new Error(t('e1'))}
  if(r.status===429)throw new Error(t('e2'));if(r.status===401)throw new Error(t('e3'));if(r.status===403)throw new Error(t('e5'));if(!r.ok)throw new Error(t('e4'));
  return r.json();
}

function startFx(code,f,wind){
  if(fxStop)fxStop();const cv=$('fx');if(!cv)return;

  let W=1,H=1;const fit=()=>{W=hero.clientWidth;H=hero.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};fit();

  const kind=code>=96?'hail':code>=95?'storm':[71,73,75,77,85,86].includes(code)?'snow':(code>=51&&code<=67)||(code>=80&&code<=82)?'rain':code===45||code===48?'fog':(code===2||code===3)?'clouds':'';
  const heavy=[65,67,75,82,86,95,96,99].includes(code),lean=Math.min(1.5,wind/25);
  const N={rain:heavy?120:70,storm:130,snow:heavy?90:55,hail:60,fog:6,clouds:5}[kind]||0;
  const P=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*.8,r:Math.random()}));
  const S=wind>=25?Array.from({length:6+Math.min(8,Math.round(wind/6))},()=>({x:Math.random()*W,y:Math.random()*H*.7,l:30+Math.random()*50,v:2+Math.random()*3})):[];
  let flash=0,raf=0;
  function draw(ts){
    ctx.clearRect(0,0,W,H);
    if(kind==='rain'||kind==='storm'){ctx.strokeStyle='rgba(30,55,95,.5)';ctx.lineWidth=1.3;ctx.beginPath();

    if(kind==='storm'){if(Math.random()<.006)flash=1;if(flash>.02){ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;ctx.fillRect(0,0,W,H);flash*=.86}}
    if(kind==='snow'){ctx.fillStyle='rgba(255,255,255,.92)';P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.5+p.r*2.2,0,6.28);ctx.fill();

    if(kind==='hail'){ctx.fillStyle='#fff';ctx.strokeStyle='rgba(110,130,155,.85)';ctx.lineWidth=1;P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2+p.r*1.8,0,6.28);ctx.fill();ctx.stroke();
      p.y+=11*p.v;p.x+=1+lean*3;if(p.y>H){p.y=-8;p.x=Math.random()*W}if(p.x>W)p.x=0})}
    if(kind==='fog'||kind==='clouds'){ctx.fillStyle=kind==='fog'?'rgba(255,255,255,.2)':'rgba(255,255,255,.3)';P.forEach(p=>{ctx.beginPath();
      ctx.ellipse(p.x,kind==='fog'?H*(.35+.5*p.r):10+p.r*H*.3,kind==='fog'?130:60+p.r*50,kind==='fog'?24:16+p.r*10,0,0,6.28);ctx.fill();p.x+=.25*p.v*(1+lean);if(p.x>W+140)p.x=-140})}
    if(S.length){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
      S.forEach(s=>{ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.l,s.y);s.x+=s.v*3+lean*2;if(s.x-s.l>W){s.x=0;s.y=Math.random()*H*.7}});ctx.stroke()}
  }

  still?draw(0):raf=requestAnimationFrame(loop);
}

function wear(f,rain,uv){
  let head,s;
  if(f<-10){head=1;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<0){head=2;s=['coat','hat','scarf','wintershoes','pants']}
  else if(f<8){head=3;s=['coat','scarf','shoes','pants']}
  else if(f<14){head=4;s=['jacket','pants','shoes']}
  else if(f<20){head=5;s=['hoodie','pants','shoes']}
  else if(f<26){head=6;s=['tee','pants','summershoes']}
  else{head=7;s=['tee','shorts','cap','summershoes']}
  if(rain>=50)s.push('rain');if(uv>=6&&!s.includes('cap'))s.push('cap');
  return {head,s};
}

function csv(text){
 var rows=[],row=[],v='',qv=false;
 for(var i=0;i<text.length;i++){var c=text[i];if(c==='"'&&qv&&text[i+1]==='"'){v+='"';i++}else if(c==='"')qv=!qv;else if(c===','&&!qv){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!qv){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(function(x){return x.trim()}))rows.push(row);row=[];v=''}else v+=c}

}
function dkey(v){var m=String(v).match(/^(\d{4}-\d{2}-\d{2})/);if(m)return m[1];var d=new Date(v);if(!isNaN(d.getTime()))return day(d);m=String(v).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):null}

function apple(xml){

 var o=emptyData();
 doc.querySelectorAll('Record').forEach(function(r){
  var type=r.getAttribute('type')||'',v=val(r.getAttribute('value')),s=new Date(r.getAttribute('startDate')||''),e=new Date(r.getAttribute('endDate')||'');if(isNaN(s.getTime()))return;var d=day(s);
  if(type.indexOf('StepCount')>=0)o.steps[d]=(o.steps[d]||0)+v;
  else if(type.indexOf('HeartRate')>=0)(o.pulses[d]||(o.pulses[d]=[])).push(v);
  else if(type.indexOf('SleepAnalysis')>=0&&/Asleep|Core|Deep|REM/.test(r.getAttribute('value')||'')){var m=(e-s)/60000;if(m>0&&m<1440)o.sleep[d]=(o.sleep[d]||0)+m}
 });
 doc.querySelectorAll('Workout').forEach(function(w){var s=new Date(w.getAttribute('startDate')||''),e=new Date(w.getAttribute('endDate')||'');if(!isNaN(s.getTime())&&!isNaN(e.getTime())){var d=day(s);o.mins[d]=(o.mins[d]||0)+Math.max(0,(e-s)/60000)}});

function googleCsv(path,text,o){
 var rows=csv(text);if(rows.length<2)return;
 var h=rows[0].map(function(x){return x.trim().toLowerCase()}),p=path.toLowerCase();
 var di=h.findIndex(function(x){return /^(date|start time|start_time|timestamp|start date)$/.test(x)||/date|start time|start_time/.test(x)});
 if(di<0)return;

 var si=idx(/step count|steps/),mi=idx(/move minutes|active minutes|moving minutes/),hi=idx(/heart rate|bpm|beats per minute/),wi=idx(/weight/),sli=idx(/sleep.*(minute|duration|hour)|sleep duration/);
 if(si<0&&/step/.test(p))si=idx(/count|value/);
 if(mi<0&&/move.?minutes|active.?minutes/.test(p))mi=idx(/count|value|minutes/);
 if(hi<0&&/heart.?rate|bpm/.test(p))hi=idx(/count|value|bpm/);
 if(wi<0&&/weight/.test(p))wi=idx(/count|value|weight/);
 if(sli<0&&/sleep/.test(p))sli=idx(/count|value|duration|minutes|hours/);
 function put(map,d,v,mode){if(!d||!Number.isFinite(v)||v<=0)return;if(mode==='array')(map[d]||(map[d]=[])).push(v);else if(mode==='last')map[d]=v;else map[d]=(map[d]||0)+v}
 rows.slice(1).forEach(function(r){
  var d=dkey(r[di]);if(!d)return;
  if(si>=0)put(o.steps,d,val(r[si]));
  if(mi>=0)put(o.mins,d,val(r[mi]));
  if(hi>=0)put(o.pulses,d,val(r[hi]),'array');
  if(wi>=0){var wv=val(r[wi]);if(/lb/.test(h[wi]||''))wv*=0.453592;put(o.weights,d,wv,'last')}
  if(sli>=0){var sv=val(r[sli]),head=h[sli]||'';if(/hour/.test(head))sv*=60;else if(/millisecond|\\bms\\b/.test(head))sv/=60000;else if(/second/.test(head))sv/=60;put(o.sleep,d,sv)}
  if(si<0&&mi<0&&hi<0&&wi<0&&sli<0){
   var vi=idx(/count|value|weight|minutes|bpm|heart rate|duration/);
   if(vi<0)return;var v=val(r[vi]);
   if(/step/.test(p))put(o.steps,d,v);
   else if(/move.?minutes|active.?minutes/.test(p))put(o.mins,d,v);
   else if(/heart.?rate|bpm/.test(p))put(o.pulses,d,v,'array');
   else if(/weight/.test(p))put(o.weights,d,v,'last');
   else if(/sleep/.test(p))put(o.sleep,d,v);
  }
 });
}

 if(a==='importfile')return importFile();
